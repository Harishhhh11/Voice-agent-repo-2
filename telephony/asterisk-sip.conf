; Asterisk / FreePBX PJSIP Configuration for Telugu AI Receptionist Platform

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Telugu AI Receptionist Endpoint
[receptionist-trunk]
type=endpoint
context=from-pstn
disallow=all
allow=ulaw
allow=alaw
allow=g722
direct_media=no
mailboxes=100@default
aors=receptionist-trunk

[receptionist-trunk]
type=aor
contact=sip:127.0.0.1:5060

; Extensions Dialplan
; [from-pstn]
; exten => _X.,1,NoOp(Incoming Telugu Customer Call to AI Receptionist)
; same => n,Answer()
; same => n,EAGI(/app/telephony/livekit-sip-bridge.sh)
; same => n,Hangup()
